name: Build Android Code Studio

on:
  push:
    branches:
      - dev
      - main
      - indexing
      - release/**
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: Select build type
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare CI signing key
        run: |
          # Fork builds cannot access the upstream repository's signing secrets.
          # Use an ephemeral key so both Debug and Release remain buildable.
          rm -f signing/signing-key.jks
          keytool -genkeypair \
            -keystore signing/signing-key.jks \
            -storepass android \
            -keypass android \
            -alias androidcs \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname 'CN=Android Code Studio CI, OU=CI, O=Android Code Studio, L=Unknown, ST=Unknown, C=US'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Determine build type
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Debug' }}"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "BUILD_TYPE_LOWER=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Prepare Gradle intermediate directories
        run: |
          mkdir -p "core/app/build/intermediates/external_file_lib_dex_archives/${BUILD_TYPE_LOWER}/desugar${BUILD_TYPE}FileDependencies"
          mkdir -p "core/app/build/intermediates/l8_art_profile/${BUILD_TYPE_LOWER}/l8DexDesugarLib${BUILD_TYPE}"

      - name: Assemble APK
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
        run: ./gradlew ":core:app:assemble${{ env.BUILD_TYPE }}" --no-daemon

      - name: List generated APKs
        if: always()
        run: find "core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}" -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-code-studio-${{ env.BUILD_TYPE_LOWER }}
          path: core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}/*.apk
          if-no-files-found: error
