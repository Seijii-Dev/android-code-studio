name: Build Axiom ACS

on:
  push:
    branches:
      - dev
      - main
      - indexing
      - release/**
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: Select build type
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare CI signing key
        run: |
          # Fork builds cannot access the upstream repository's signing secrets.
          # Use an ephemeral key so both Debug and Release remain buildable.
          rm -f signing/signing-key.jks
          keytool -genkeypair \
            -keystore signing/signing-key.jks \
            -storepass android \
            -keypass android \
            -alias androidcs \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname 'CN=Axiom ACS CI, OU=CI, O=Axiom ACS, L=Unknown, ST=Unknown, C=US'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Determine build type
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Debug' }}"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "BUILD_TYPE_LOWER=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Prepare Gradle intermediate directories
        run: |
          mkdir -p "core/app/build/intermediates/external_file_lib_dex_archives/${BUILD_TYPE_LOWER}/desugar${BUILD_TYPE}FileDependencies"
          mkdir -p "core/app/build/intermediates/l8_art_profile/${BUILD_TYPE_LOWER}/l8DexDesugarLib${BUILD_TYPE}"
          touch "core/app/build/intermediates/l8_art_profile/${BUILD_TYPE_LOWER}/l8DexDesugarLib${BUILD_TYPE}/baseline-prof.txt"

      - name: Assemble APK
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
        run: ./gradlew ":core:app:assemble${{ env.BUILD_TYPE }}" --no-daemon

      - name: List generated APKs
        if: always()
        run: find "core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}" -type f -name '*.apk' -print 2>/dev/null || true

      - name: Package APK artifacts
        if: success()
        run: |
          set -euo pipefail
          APK_DIR="core/app/build/outputs/apk/${BUILD_TYPE_LOWER}"
          mkdir -p artifacts
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK files were generated in $APK_DIR" >&2
            exit 1
          fi
          cp "${APKS[@]}" artifacts/
          (cd artifacts && sha256sum ./*.apk > SHA256SUMS.txt)
          zip -j "artifacts/axiom-acs-${BUILD_TYPE_LOWER}-${GITHUB_RUN_NUMBER}.zip" artifacts/*.apk artifacts/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: axiom-acs-${{ env.BUILD_TYPE_LOWER }}
          path: artifacts/*
          if-no-files-found: error

      - name: Send Release APKs to Telegram
        if: env.BUILD_TYPE == 'Release' && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.RELEASE_TOPIC_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo 'BOT_TOKEN and CHAT_ID repository secrets are required to send APKs to Telegram.' >&2
            exit 1
          fi

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          COMMIT_MESSAGE="$(git log -1 --pretty=%s | cut -c1-180)"
          CAPTION="Axiom ACS Release\nRun #${GITHUB_RUN_NUMBER} • ${GITHUB_SHA::12}\n${COMMIT_MESSAGE}"

          send_args=(-F "chat_id=${TELEGRAM_CHAT_ID}")
          if [ -n "$TELEGRAM_TOPIC_ID" ]; then
            send_args+=(-F "message_thread_id=${TELEGRAM_TOPIC_ID}")
          fi

          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            "${send_args[@]}" \
            -F "text=${CAPTION}" \
            "${API}/sendMessage")"
          echo "$response" | grep -q '"ok":true' || { echo "$response" >&2; exit 1; }

          while IFS= read -r apk; do
            [ -n "$apk" ] || continue
            filename="$(basename "$apk")"
            response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
              "${send_args[@]}" \
              -F "caption=${CAPTION}\nAPK: ${filename}" \
              -F "document=@${apk};type=application/vnd.android.package-archive" \
              "${API}/sendDocument")"
            echo "$response" | grep -q '"ok":true' || { echo "$response" >&2; exit 1; }
            echo "Sent ${filename} to Telegram"
          done < <(find artifacts -maxdepth 1 -type f -name '*.apk' -print | sort)
